name: APK Android
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Decode Keystore from Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/trickymind.keystore
          ls -lh app/trickymind.keystore
      - name: Setup Signing
        run: |
          cat > app/signing.gradle.kts << 'GRAD'
          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("trickymind.keystore")
                      storePassword = System.getenv("KEYSTORE_PASSWORD") ?: "AbdoAbdo1997"
                      keyAlias = System.getenv("KEY_ALIAS") ?: "trickymind"
                      keyPassword = System.getenv("KEY_PASSWORD") ?: "AbdoAbdo1997"
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                  }
              }
          }
          GRAD
          cat app/signing.gradle.kts
      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --stacktrace
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrickyMind-US-Ready-AAB
          path: app/build/outputs/bundle/release/app-release.aab
